quarkus.application.name=catalogo-backend

quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=*

quarkus.datasource.db-kind=postgresql

quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration

quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

quarkus.resteasy-reactive.exception-mappers-enabled=true

%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.datasource.username=${DB_USERNAME:postgres}
%dev.quarkus.datasource.password=${DB_PASSWORD:1234}
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/catalogo}

%test.quarkus.datasource.username=${DB_USERNAME:postgres}
%test.quarkus.datasource.password=${DB_PASSWORD:1234}
%test.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/catalogo_test}
%test.quarkus.flyway.clean-at-start=true

%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.hibernate-orm.log.sql=false
