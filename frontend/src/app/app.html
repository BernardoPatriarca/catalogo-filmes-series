<p-toast position="top-right" />
<p-confirmdialog />

<div class="app-shell">
  <aside class="app-sidebar">
    <a routerLink="/dashboard" class="app-brand">
      <img src="logo.svg" alt="" class="app-brand-logo" />
      <span class="app-brand-text">
        <strong>CATÁLOGO</strong>
        <small>filmes &amp; séries</small>
      </span>
    </a>

    <nav class="app-nav">
      @for (link of navLinks; track link.route) {
        <a
          [routerLink]="link.route"
          routerLinkActive="is-active"
          class="app-nav-link"
        >
          <i [class]="link.icon"></i>
          <span class="app-nav-label">
            {{ link.label }}
            <small>{{ link.hint }}</small>
          </span>
        </a>
      }
    </nav>

    <div class="app-sidebar-footer">
      <i class="pi pi-sparkles"></i>
      <p>Organize, avalie e descubra tudo que você já assistiu.</p>
    </div>
  </aside>

  <div class="app-main">
    <header class="app-topbar">
      <button type="button" class="app-nav-toggle" aria-label="Abrir menu" (click)="mobileNavOpen.set(true)">
        <i class="pi pi-bars"></i>
      </button>
      <a routerLink="/dashboard" class="app-brand app-brand-compact">
        <img src="logo.svg" alt="" class="app-brand-logo" />
        <strong>CATÁLOGO</strong>
      </a>
    </header>

    <main class="app-content">
      <router-outlet />
    </main>
  </div>
</div>

<p-drawer [visible]="mobileNavOpen()" (visibleChange)="mobileNavOpen.set($event)" styleClass="app-drawer" header=" ">
  <a routerLink="/dashboard" class="app-brand app-brand-drawer">
    <img src="logo.svg" alt="" class="app-brand-logo" />
    <span class="app-brand-text">
      <strong>CATÁLOGO</strong>
      <small>filmes &amp; séries</small>
    </span>
  </a>
  <nav class="app-nav">
    @for (link of navLinks; track link.route) {
      <a [routerLink]="link.route" routerLinkActive="is-active" class="app-nav-link">
        <i [class]="link.icon"></i>
        <span class="app-nav-label">
          {{ link.label }}
          <small>{{ link.hint }}</small>
        </span>
      </a>
    }
  </nav>
</p-drawer>
